<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NexusDeals" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="impact-site-verification" value="109f8417-9e03-4f3c-8d5a-df3d2eb05f23" />
  <title id="pageTitle">NexusDeals Global | Preisvergleich auf europäischen Plattformen (Amazon • OTTO • Kaufland • Zalando • MediaMarkt • eBay)</title>
  <script>
    (function() {
      try {
        localStorage.removeItem('nexus_deals_lang');
        sessionStorage.removeItem('nexus_deals_lang_manual');
        var manual = sessionStorage.getItem('nexus_deals_user_clicked_lang');
        var lang = manual;
        if (!lang) {
          var primary = (navigator.language || navigator.userLanguage || '').toLowerCase();
          if (primary.indexOf('de') === 0) {
            lang = 'de';
          } else if (primary.indexOf('ar') === 0) {
            lang = 'ar';
          } else if (primary.indexOf('en') === 0) {
            lang = 'en';
          } else if (window.__DETECTED_DEVICE_LANG__) {
            lang = window.__DETECTED_DEVICE_LANG__;
          } else {
            var navLangs = navigator.languages || [];
            for (var i = 0; i < navLangs.length; i++) {
              var code = (navLangs[i] || '').toLowerCase();
              if (code.indexOf('de') === 0) { lang = 'de'; break; }
              if (code.indexOf('ar') === 0) { lang = 'ar'; break; }
              if (code.indexOf('en') === 0) { lang = 'en'; break; }
            }
          }
        }
        if (!lang) lang = 'de';
        document.documentElement.lang = lang;
        document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
      } catch (e) {}
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <style>
    #appSplash{position:fixed;inset:0;z-index:100000;background:radial-gradient(circle at 50% 35%,#10213d 0%,#0a0e17 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .35s ease,visibility .35s ease}
    #appSplash.hide{opacity:0;visibility:hidden;pointer-events:none}
    #appSplash img{width:92px;height:92px;border-radius:22px;box-shadow:0 10px 40px rgba(14,165,233,.35);animation:splashPulse 1.6s ease-in-out infinite}
    #appSplash b{color:#f8fafc;font:800 1.25rem system-ui,sans-serif;letter-spacing:.3px}
    #appSplash span{color:#38bdf8}
    #appSplash i{width:38px;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#38bdf8,transparent);background-size:200% 100%;animation:splashBar 1.1s linear infinite}
    @keyframes splashPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes splashBar{from{background-position:200% 0}to{background-position:-200% 0}}
  </style>
  <link rel="stylesheet" href="/styles.css?v=3.4" />
</head>
<body>
  <div id="appSplash"><img src="/icons/icon-192.png" alt="" /><b>Nexus<span>Deals</span></b><i></i></div>
  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeFilterDrawer()"></div>

  <!-- Sleek Compact Header -->
  <header class="main-header">
    <div class="header-inner">
      <div class="header-top-row">
        <div class="brand-logo" onclick="resetAllFilters()">
          <div class="logo-icon">N</div>
          <div class="brand-text">
            <h1>NexusDeals</h1>
            <span class="brand-subtitle" data-i18n="subBrandText">Amazon • OTTO • MediaMarkt • Kaufland • Zalando • Galaxus • eBay • Douglas • IKEA • AliExpress • Temu • SHEIN</span>
          </div>
        </div>

        <!-- 3-Language Switcher -->
        <div class="lang-switcher">
          <button type="button" class="lang-btn active" id="langBtn-de" onclick="setLanguage('de', true)">DE</button>
          <button type="button" class="lang-btn" id="langBtn-en" onclick="setLanguage('en', true)">EN</button>
          <button type="button" class="lang-btn" id="langBtn-ar" onclick="setLanguage('ar', true)">AR</button>
        </div>
      </div>

      <form class="header-search" onsubmit="handleMainSearch(event)">
        <input type="text" id="mainSearchInput" data-i18n-placeholder="searchPlaceholder" placeholder="Beliebiges Produkt suchen (Smartphones, Kleidung, Parfüm, Möbel, Werkzeug, Gaming...)" />
        <button type="button" id="clearSearchBtn" class="btn-clear-search" onclick="clearSearch()" style="display:none;" title="Löschen">✕</button>
        <button type="submit" class="btn-search-main">
          <span data-i18n="searchBtn">🔍 Suchen</span>
        </button>
      </form>

      <div class="header-actions">
        <!-- Collapsible Filter & Sort Dropdown Trigger -->
        <button type="button" class="btn-action" id="filterToggleBtn" onclick="toggleFilterDrawer()">
          <span data-i18n="filterMenuBtn">🎛️ Filter & Sortierung ▾</span>
        </button>
      </div>
    </div>

    <!-- Sticky Horizontal Category Strip (12 Comprehensive Life Categories) -->
    <div class="categories-strip-wrap">
      <nav class="categories-bar" id="categoriesBar">
        <button class="cat-btn active" data-cat="all" onclick="selectCategory('all', this)" data-i18n="cat_all">🌐 Alle</button>
        <button class="cat-btn" data-cat="smartphones" onclick="selectCategory('smartphones', this)" data-i18n="cat_smartphones">📱 Smartphones & Tablets</button>
        <button class="cat-btn" data-cat="gaming" onclick="selectCategory('gaming', this)" data-i18n="cat_gaming">💻 Laptops & Gaming</button>
        <button class="cat-btn" data-cat="tv_audio" onclick="selectCategory('tv_audio', this)" data-i18n="cat_tv_audio">📺 TV & Audio</button>
        <button class="cat-btn" data-cat="home_kitchen" onclick="selectCategory('home_kitchen', this)" data-i18n="cat_home_kitchen">☕ Küche & Haushalt</button>
        <button class="cat-btn" data-cat="fashion_shoes" onclick="selectCategory('fashion_shoes', this)" data-i18n="cat_fashion_shoes">👟 Mode & Schuhe</button>
        <button class="cat-btn" data-cat="perfumes_beauty" onclick="selectCategory('perfumes_beauty', this)" data-i18n="cat_perfumes_beauty">💄 Parfüm & Beauty</button>
        <button class="cat-btn" data-cat="furniture_decor" onclick="selectCategory('furniture_decor', this)" data-i18n="cat_furniture_decor">🛋️ Möbel & Wohnen</button>
        <button class="cat-btn" data-cat="sports_fitness" onclick="selectCategory('sports_fitness', this)" data-i18n="cat_sports_fitness">🏋️ Sport & Fitness</button>
        <button class="cat-btn" data-cat="kids_toys" onclick="selectCategory('kids_toys', this)" data-i18n="cat_kids_toys">🧸 Kinder & Spielzeug</button>
        <button class="cat-btn" data-cat="tools_garden" onclick="selectCategory('tools_garden', this)" data-i18n="cat_tools_garden">🛠️ Werkzeug & Garten</button>
        <button class="cat-btn" data-cat="auto_car" onclick="selectCategory('auto_car', this)" data-i18n="cat_auto_car">🚗 Autozubehör & Elektronik</button>
        <button class="cat-btn" data-cat="travel_luggage" onclick="selectCategory('travel_luggage', this)" data-i18n="cat_travel_luggage">🧳 Reise & Smartwatches</button>
      </nav>
    </div>

    <!-- Collapsible Filter & Sort Popover Drawer -->
    <div class="dropdown-drawer" id="filterDrawer">
      <div class="drawer-card">
        <div class="filter-drawer-header">
          <strong style="color:#38bdf8; font-size:0.92rem;" data-i18n="filterDrawerTitle">🎛️ Filter & Sortierung</strong>
          <div class="filter-drawer-actions">
            <button type="button" class="btn-action btn-sm" onclick="resetAllFilters()" data-i18n="resetFiltersBtn">Zurücksetzen ↺</button>
            <button type="button" class="btn-action btn-sm" onclick="closeFilterDrawer()" data-i18n="closeBtn">✕</button>
          </div>
        </div>

        <div style="margin-bottom:14px;">
          <label style="display:block; font-size:0.8rem; color:var(--text-secondary); font-weight:600; margin-bottom:6px;" data-i18n="filterStoreLabel">Shop / Globale Plattform:</label>
          <div class="store-filter-pills">
            <button type="button" class="store-filter-btn active" data-store="all" onclick="selectStoreFilter('all', this)" data-i18n="storeAll">Alle (12 Plattformen)</button>
            <button type="button" class="store-filter-btn" data-store="Amazon" onclick="selectStoreFilter('Amazon', this)">Amazon</button>
            <button type="button" class="store-filter-btn" data-store="OTTO" onclick="selectStoreFilter('OTTO', this)">OTTO</button>
            <button type="button" class="store-filter-btn" data-store="MediaMarkt" onclick="selectStoreFilter('MediaMarkt', this)">MediaMarkt</button>
            <button type="button" class="store-filter-btn" data-store="Kaufland" onclick="selectStoreFilter('Kaufland', this)">Kaufland</button>
            <button type="button" class="store-filter-btn" data-store="eBay" onclick="selectStoreFilter('eBay', this)">eBay</button>
            <button type="button" class="store-filter-btn" data-store="Zalando" onclick="selectStoreFilter('Zalando', this)">Zalando</button>
            <button type="button" class="store-filter-btn" data-store="Galaxus" onclick="selectStoreFilter('Galaxus', this)">Galaxus</button>
            <button type="button" class="store-filter-btn" data-store="Douglas" onclick="selectStoreFilter('Douglas', this)">Douglas</button>
            <button type="button" class="store-filter-btn" data-store="IKEA" onclick="selectStoreFilter('IKEA', this)">IKEA</button>
            <button type="button" class="store-filter-btn" data-store="AliExpress" onclick="selectStoreFilter('AliExpress', this)">AliExpress</button>
            <button type="button" class="store-filter-btn" data-store="Temu" onclick="selectStoreFilter('Temu', this)">Temu</button>
            <button type="button" class="store-filter-btn" data-store="SHEIN" onclick="selectStoreFilter('SHEIN', this)">SHEIN</button>
          </div>
        </div>

        <div class="filter-grid-popover">
          <div class="filter-col">
            <label><span data-i18n="maxPriceTitle">Maximalpreis:</span> <strong id="maxPriceLabel" style="color:#38bdf8;"></strong></label>
            <input type="range" id="maxPriceSlider" min="20" max="2500" step="20" value="2500" oninput="handlePriceSlider(this.value)" style="width:100%; accent-color:#38bdf8; cursor:pointer;" />
          </div>

          <div class="filter-col">
            <label data-i18n="sortLabelTitle">Sortierung nach:</label>
            <select id="sortSelect" class="filter-select" onchange="applyFilters()">
              <option value="popular" data-i18n="sortPopular">Beliebteste Angebote</option>
              <option value="discount" data-i18n="sortDiscount">Höchster Rabatt & Ersparnis %</option>
              <option value="price_asc" data-i18n="sortPriceAsc">Preis: Niedrigster zuerst</option>
              <option value="price_desc" data-i18n="sortPriceDesc">Preis: Höchster zuerst</option>
              <option value="rating" data-i18n="sortRating">Beste Kundenbewertung ⭐</option>
            </select>
          </div>

          <div class="filter-col">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; background:var(--bg-elevated); padding:9px 12px; border-radius:8px; border:1px solid var(--border-color); margin:0;">
              <input type="checkbox" id="flashOnlyCheckbox" onchange="applyFilters()" style="accent-color:#10b981; width:16px; height:16px;" />
              <span data-i18n="flashDealsOnly" style="color:#fff;">🔥 Nur Blitz-Deals & Top-Ersparnis</span>
            </label>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Products Catalog Grid -->
  <main class="catalog-container">
    <div class="catalog-status-bar">
      <div id="resultsCounterText"></div>
      <div data-i18n="catalogTip" style="font-size:0.8rem; color:#94a3b8;"></div>
    </div>

    <div class="products-grid" id="productsGrid"></div>
  </main>

  <!-- Product Detail, Price History & Alternatives Modal -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modalProductTitle" style="font-size:1.05rem;"></h3>
        <button class="btn-close-modal" onclick="closeProductModal()">✕</button>
      </div>
      <div id="modalProductBody"></div>
    </div>
  </div>

  <!-- High-Resolution Full-Screen Image Lightbox Modal -->
  <div class="lightbox-overlay" id="imageLightboxModal" onclick="handleLightboxBackdropClick(event)">
    <div class="lightbox-topbar">
      <div class="lightbox-counter" id="lightboxCounter">1 / 1</div>
      <div class="lightbox-tools">
        <button type="button" class="lightbox-tool-btn" onclick="zoomLightboxImage(0.25)" title="Zoom In">➕</button>
        <button type="button" class="lightbox-tool-btn" onclick="zoomLightboxImage(-0.25)" title="Zoom Out">➖</button>
        <button type="button" class="lightbox-tool-btn" onclick="resetLightboxZoom()" title="Reset Zoom">1:1</button>
        <button type="button" class="lightbox-close-btn" onclick="closeImageLightbox()" title="Close">✕</button>
      </div>
    </div>

    <div class="lightbox-viewport" id="lightboxViewport" onclick="toggleLightboxZoom(event)">
      <button type="button" class="lightbox-nav-btn lightbox-prev" onclick="navigateLightbox(-1, event)">‹</button>
      <div class="lightbox-img-wrapper" id="lightboxImgWrapper">
        <img id="lightboxMainImg" src="" alt="High-Resolution Preview" />
      </div>
      <button type="button" class="lightbox-nav-btn lightbox-next" onclick="navigateLightbox(1, event)">›</button>
    </div>

    <div class="lightbox-thumbs-bar" id="lightboxThumbsBar"></div>
  </div>

  <!-- Native Mobile App Bottom Navigation Bar (Customer Only) -->
  <nav class="mobile-bottom-nav">
    <button type="button" class="bottom-nav-item active" id="bottomNavHomeBtn" onclick="handleBottomNavHome(event)">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span class="nav-label" data-i18n="navHome">Start</span>
    </button>
    <button type="button" class="bottom-nav-item" id="bottomNavSearchBtn" onclick="handleBottomNavSearch(event)">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <span class="nav-label" data-i18n="navSearch">Suche</span>
    </button>
    <button type="button" class="bottom-nav-item" id="bottomNavFilterBtn" onclick="handleBottomNavFilter(event)">
      <svg class="nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="21" x2="4" y2="14"/>
        <line x1="4" y1="10" x2="4" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/>
        <line x1="12" y1="8" x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/>
        <line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1" y1="14" x2="7" y2="14"/>
        <line x1="9" y1="8" x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
      <span class="nav-label" data-i18n="navFilter">Filter</span>
    </button>
    <button type="button" class="bottom-nav-item deals-btn" id="bottomNavDealsBtn" onclick="toggleFlashDealsFilter(event)">
      <svg class="nav-svg nav-svg-deal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
      </svg>
      <span class="nav-label" data-i18n="navDeals">Deals 🔥</span>
    </button>
  </nav>

  <script src="/app.js?v=3.4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
    }
    if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
      document.documentElement.classList.add('is-standalone');
    }
  </script>
</body>
</html>
